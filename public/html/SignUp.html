<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Únete a SNEAK Studio.">
  <title>SNEAK — Crear Cuenta</title>
  <link rel="icon" type="image/x-icon" href="/favicon_io/favsk.svg">
  <link rel="stylesheet" href="/css/Sign-Up.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5/css/all.min.css">
  <style>
    .form-group .error-msg {
      font-size: 12px;
      color: #ff4444;
      margin-top: 5px;
      display: none;
    }

    .form-group input.input-error {
      border-color: #ff4444 !important;
    }

    .submit-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .submit-btn .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(0, 0, 0, .3);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .strength-bar {
      height: 3px;
      border-radius: 3px;
      margin-top: 6px;
      background: #222;
      overflow: hidden;
    }

    .strength-fill {
      height: 100%;
      width: 0;
      border-radius: 3px;
      transition: width .3s, background .3s;
    }

    .strength-label {
      font-size: 11px;
      color: #555;
      margin-top: 3px;
    }

    .auth-toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      color: #000;
      padding: 11px 24px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .3);
      z-index: 9999;
      white-space: nowrap;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
    }

    .auth-toast.show {
      opacity: 1;
    }
  </style>
</head>

<body>
  <main class="auth-wrapper">

    <section class="auth-image-video">
      <video src="/videos/video-regist.mp4" class="main-img" alt="Sneak Studio" autoplay muted loop ></video>
      <div class="overlay-logo">
        <img src="/img/logo (1).png" alt="SNEAK">
      </div>
    </section>

    <section class="auth-form">
      <div class="auth-container">
        <header class="auth-header">
          <h1>Crea tu cuenta</h1>
          <p>Regístrate para vivir la experiencia completa.</p>
        </header>

        <div class="social-grid">
          <button type="button" class="social-btn" id="btn-apple">
            <img src="/img/Apple_Logo_0 1.png" alt=""> <span>Apple</span>
          </button>
          <button type="button" class="social-btn" id="btn-google">
            <img src="/img/image 155.png" alt=""> <span>Google</span>
          </button>
        </div>

        <div class="divider"><span>o utiliza tu correo</span></div>

        <form id="signup-form" novalidate>

          <div class="form-group">
            <label for="username">Nombre de usuario</label>
            <input type="text" id="username" placeholder="Ej: naxof_44" maxlength="30"
              oninput="this.value=this.value.replace(/[^a-zA-Z0-9_]/g,'').toLowerCase()" required>
            <span class="error-msg" id="err-username"></span>
          </div>

          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" placeholder="nombre@ejemplo.com" autocomplete="email" required>
            <span class="error-msg" id="err-email"></span>
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="password-wrapper">
              <input type="password" id="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password"
                oninput="checkStrength(this.value)" required>
              <button type="button" class="toggle-password" id="toggle-pass">
                <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
                  stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
                  stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>
            <div class="strength-bar">
              <div class="strength-fill" id="strength-fill"></div>
            </div>
            <span class="strength-label" id="strength-label"></span>
            <span class="error-msg" id="err-pass"></span>
          </div>

          <button type="submit" class="submit-btn" id="btn-submit">Registrarse ahora</button>
        </form>

        <footer class="auth-footer">
          ¿Ya eres parte de SNEAK? <a href="/login">Inicia sesión</a>
        </footer>
      </div>
    </section>
  </main>

  <div class="auth-toast" id="toast"></div>

  <script>
    

    window.checkStrength = function (val) {
      const fill = document.getElementById('strength-fill');
      const label = document.getElementById('strength-label');
      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const niveles = [
        { w: '0%', c: 'transparent', txt: '' },
        { w: '25%', c: '#ff4444', txt: 'Muy débil' },
        { w: '50%', c: '#ff8800', txt: 'Débil' },
        { w: '75%', c: '#ffcc00', txt: 'Buena' },
        { w: '100%', c: '#4caf50', txt: 'Fuerte' },
      ];
      const n = niveles[score] || niveles[0];
      fill.style.width = n.w;
      fill.style.background = n.c;
      label.textContent = n.txt;
      label.style.color = n.c;
    };
  </script>

  <script type="module">
    import {
      getAuth_,
      createUserWithEmailAndPassword,
      signInWithPopup,
      updateProfile,
      guardarSesionLocal,
      guardarPerfilFirestore,
      leerPerfilFirestore,
      getUsuarioLocal,
    } from '/js/firebase-auth.js';
    import { GoogleAuthProvider } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { getFirestore } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
    import { getFirebaseApp } from '/js/firebase-config.js';
    const auth           = await getAuth_();
    const googleProvider = new GoogleAuthProvider();
    const db             = getFirestore(await getFirebaseApp());

    

    function toast(msg, dur = 3500) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), dur);
    }

    function setError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.style.display = msg ? 'block' : 'none';
    }

    function setLoading(on) {
      const btn = document.getElementById('btn-submit');
      btn.disabled = on;
      btn.innerHTML = on
        ? '<span class="spinner"></span> Creando cuenta...'
        : 'Registrarse ahora';
    }

    function limpiarErrores() {
      ['err-username', 'err-email', 'err-pass'].forEach(id => setError(id, ''));
      ['username', 'email', 'password'].forEach(id =>
        document.getElementById(id).classList.remove('input-error'));
    }

    function mensajeError(code) {
      const e = {
        'auth/email-already-in-use': 'Ya existe una cuenta con ese correo',
        'auth/invalid-email': 'El correo no es válido',
        'auth/weak-password': 'La contraseña es demasiado débil',
        'auth/network-request-failed': 'Sin conexión. Revisa tu internet',
      };
      return e[code] || 'Error al crear la cuenta. Inténtalo de nuevo';
    }

    

    const sesion = getUsuarioLocal();
    if (sesion?.uid) {
      window.location.href = sesion.onboarding ? 'inicio.html' : 'Onboarding.html';
    }

    

    document.getElementById('toggle-pass').addEventListener('click', () => {
      const inp = document.getElementById('password');
      inp.type = inp.type === 'password' ? 'text' : 'password';
      document.getElementById('toggle-pass').classList.toggle('active');
    });

    

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      limpiarErrores();

      const username = document.getElementById('username').value.trim();
      const nombre = username; 

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      

      let valido = true;
      if (!username || username.length < 3) {
        setError('err-username', username ? 'Mínimo 3 caracteres' : 'Elige un nombre de usuario');
        document.getElementById('username').classList.add('input-error');
        valido = false;
      }
      if (!email) {
        setError('err-email', 'Escribe tu correo');
        document.getElementById('email').classList.add('input-error');
        valido = false;
      }
      if (password.length < 8) {
        setError('err-pass', 'Mínimo 8 caracteres');
        document.getElementById('password').classList.add('input-error');
        valido = false;
      }
      if (!valido) return;

      setLoading(true);
      try {
        

        const cred = await createUserWithEmailAndPassword(auth, email, password);

        

        await updateProfile(cred.user, { displayName: username });

        

        const perfil = {
          uid: cred.user.uid,
          nombre: username,
          username,
          email,
          foto: null,
          bio: '',
          ubicacion: '',
          web: '',
          tipos: [],
          generos: [],
          redes: {},
          seguidores: 0,
          siguiendo: 0,
          onboarding: false,
          creadoEn: new Date().toISOString(),
        };

        

        await guardarPerfilFirestore(cred.user.uid, perfil);

        

        guardarSesionLocal(cred.user, perfil);

        

        window.location.href = '/onboarding';

      } catch (err) {
        setLoading(false);
        const msg = mensajeError(err.code);
        if (err.code === 'auth/email-already-in-use') {
          setError('err-email', msg);
          document.getElementById('email').classList.add('input-error');
        } else {
          toast(msg);
        }
      }
    });

    

    document.getElementById('btn-google').addEventListener('click', async () => {
      try {
        const cred = await signInWithPopup(auth, googleProvider);
        const u = cred.user;

        

        const perfilExistente = await leerPerfilFirestore(u.uid);

        if (perfilExistente) {
          

          guardarSesionLocal(u, perfilExistente);
          window.location.href = perfilExistente.onboarding ? 'inicio.html' : 'Onboarding.html';
        } else {
          

          const perfil = {
            uid: u.uid,
            nombre: u.displayName || u.email.split('@')[0],
            username: (u.displayName || u.email.split('@')[0]).replace(/\s/g, '_').toLowerCase(),
            email: u.email,
            foto: u.photoURL || null,
            bio: '', ubicacion: '', web: '',
            tipos: [], generos: [], redes: {},
            seguidores: 0, siguiendo: 0,
            onboarding: false,
            creadoEn: new Date().toISOString(),
          };
          await guardarPerfilFirestore(u.uid, perfil);
          guardarSesionLocal(u, perfil);
          window.location.href = '/onboarding';
        }
      } catch (err) {
        if (err.code !== 'auth/popup-closed-by-user') {
          toast('Error con Google. Inténtalo de nuevo');
        }
      }
    });

    

    document.getElementById('btn-apple').addEventListener('click', () => {
      toast('Login con Apple próximamente');
    });
  </script>
</body>

</html>
