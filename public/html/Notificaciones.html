<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/proyectos.css">
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/Notificaciones.css">
  <link rel="stylesheet" href="/css/footer.css">
  <link rel="stylesheet" href="/css/Bar-player.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" type="image/x-icon" href="/favicon_io/favsk (6).svg">

  <title>Notificaciones — Sneak Studio</title>
</head>
<body>

  <section id="app" class="home-section">
    <div style="max-width:700px;margin:0 auto;padding:40px 24px 140px">

      <h1 style="font-family:'Syne',sans-serif;font-size:28px;font-weight:800;margin-bottom:8px">Notificaciones</h1>
      <p style="color:#555;font-size:13px;margin-bottom:32px">Lo último de tu actividad y de artistas que sigues.</p>

      <div style="display:flex;gap:4px;margin-bottom:28px;background:rgba(255,255,255,.05);border-radius:12px;padding:4px;width:fit-content">
        <button id="tab-todas" onclick="setTab('todas')"
          style="background:#fff;color:#000;border:none;border-radius:9px;padding:8px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s">
          Todas
        </button>
        <button id="tab-likes" onclick="setTab('likes')"
          style="background:none;color:#555;border:none;border-radius:9px;padding:8px 20px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s">
          Likes
        </button>
        <button id="tab-nuevas" onclick="setTab('nuevas')"
          style="background:none;color:#555;border:none;border-radius:9px;padding:8px 20px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s">
          Nuevas canciones
        </button>
      </div>

      <div id="notif-list"></div>

    </div>
  </section>

    
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="/js/emailjs-config.js"></script>
  <script src="/js/denuncia.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/player-global.js"></script>
  <script type="module" src="/js/auth-guard.js"></script>
  <script type="module">
  import { getUsuarioLocal } from '/js/firebase-auth.js';
  import { leerMisCanciones, leerFeed } from '/js/sneak-db.js';

  const u   = getUsuarioLocal();
  const $   = id => document.getElementById(id);
  const fmt = n => !n?'0':n>=1000000?(n/1000000).toFixed(1)+'M':n>=1000?(n/1000).toFixed(0)+'k':String(n);

  let _notifs = [];
  let _tabActual = 'todas';

  async function init() {
    if (!u?.uid) return;

    

    const misCanciones = await leerMisCanciones().catch(()=>[]);

    

    const notifs = [];
    const ahora  = Date.now();

    misCanciones.forEach(c => {
      if ((c.reproducciones||0) > 0) {
        notifs.push({
          tipo: 'reproduccion',
          ico:  'fas fa-play-circle',
          color: '#FF6200',
          texto: `Tu canción <strong>${c.titulo}</strong> tiene ${fmt(c.reproducciones)} reproducciones`,
          sub:   c.genero || c.tipo,
          link:  `/cancion?id=${c.id}`,
          portada: c.portada,
          ts:    ahora - Math.random()*86400000*3,
        });
      }
      if ((c.likes||0) > 0) {
        notifs.push({
          tipo: 'like',
          ico:  'fas fa-heart',
          color: '#ff4466',
          texto: `<strong>${fmt(c.likes)} personas</strong> le dieron like a <strong>${c.titulo}</strong>`,
          sub:   c.tipo,
          link:  `/cancion?id=${c.id}`,
          portada: c.portada,
          ts:    ahora - Math.random()*86400000*2,
        });
      }
    });

    

    const recientes = await leerFeed({ maxItems: 5 }).catch(()=>[]);
    recientes.forEach(c => {
      if (c.uid !== u.uid) {
        notifs.push({
          tipo: 'nueva',
          ico:  'fas fa-music',
          color: '#4caf50',
          texto: `<strong>${c.artista}</strong> publicó <strong>${c.titulo}</strong>`,
          sub:   c.genero || 'Nueva canción',
          link:  `/cancion?id=${c.id}`,
          portada: c.portada,
          ts:    ahora - Math.random()*86400000,
        });
      }
    });

    

    _notifs = notifs.sort((a,b)=>b.ts-a.ts);
    renderNotifs();
  }

  function renderNotifs() {
    const list = $('notif-list');
    if (!list) return;

    let filtradas = _notifs;
    if (_tabActual === 'likes')  filtradas = _notifs.filter(n=>n.tipo==='like');
    if (_tabActual === 'nuevas') filtradas = _notifs.filter(n=>n.tipo==='nueva');

    if (!filtradas.length) {
      list.innerHTML = `<div style="text-align:center;padding:60px 20px;color:#333">
        <i class="fas fa-bell" style="font-size:40px;opacity:.3;display:block;margin-bottom:16px"></i>
        <p style="font-size:14px">No hay notificaciones aquí todavía</p>
      </div>`;
      return;
    }

    list.innerHTML = filtradas.map((n,i) => `
      <div onclick="window.location.href='${n.link}'"
        style="display:flex;align-items:center;gap:14px;padding:14px 16px;
          border-radius:12px;cursor:pointer;transition:background .2s;margin-bottom:4px;
          background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)"
        onmouseover="this.style.background='rgba(255,255,255,.07)'"
        onmouseout="this.style.background='rgba(255,255,255,.03)'">
        <div style="width:44px;height:44px;border-radius:10px;overflow:hidden;flex-shrink:0;background:#1a1a1a">
          ${n.portada
            ? `<img src="${n.portada}" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none'">`
            : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center">
                <i class="${n.ico}" style="color:${n.color};font-size:18px"></i>
              </div>`}
        </div>
        <div style="flex:1;min-width:0">
          <p style="font-size:13px;color:rgba(255,255,255,.85);margin-bottom:3px;line-height:1.4">${n.texto}</p>
          <p style="font-size:11px;color:#555">${n.sub} · ${tiempoRelativo(n.ts)}</p>
        </div>
        <i class="${n.ico}" style="color:${n.color};font-size:16px;flex-shrink:0;opacity:.7"></i>
      </div>`).join('');
  }

  window.setTab = function(tab) {
    _tabActual = tab;
    ['todas','likes','nuevas'].forEach(t => {
      const btn = $('tab-'+t);
      if (!btn) return;
      if (t===tab) { btn.style.background='#fff';btn.style.color='#000';btn.style.fontWeight='700'; }
      else         { btn.style.background='none';btn.style.color='#555';btn.style.fontWeight='400'; }
    });
    renderNotifs();
  };

  function tiempoRelativo(ts) {
    const diff = Date.now() - ts;
    const mins = Math.floor(diff/60000);
    const hrs  = Math.floor(diff/3600000);
    const dias = Math.floor(diff/86400000);
    if (mins < 1)  return 'ahora mismo';
    if (mins < 60) return `hace ${mins}m`;
    if (hrs  < 24) return `hace ${hrs}h`;
    return `hace ${dias}d`;
  }

  init();
  </script>
  <script src="/js/scroll-buttons.js"></script>
</body>
</html>
