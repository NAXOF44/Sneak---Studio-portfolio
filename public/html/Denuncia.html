  <section class="home-section" id="den-section">

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: 'Inter', sans-serif;
        background: #ffffff;
        color: #111;
        min-height: 100vh;
        user-select: none;
      }

      /* ═══════════════════════════════════════
   HOME SECTION
═══════════════════════════════════════ */

      .home-section {
        position: relative;

        width: calc(100% - 260px);
        margin-left: 260px;

        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        /* MÁS ESPACIO ARRIBA */
        padding:
          20px 32px 70px;
      }

      /* ═══════════════════════════════════════
   CONTENIDO CENTRAL
═══════════════════════════════════════ */

      .CONTENIDO {
        width: 100%;
        max-width: 700px;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        text-align: center;

        /* SUBE EL CONTENIDO */
        transform: translateY(-30px);
      }

      /* ═══════════════════════════════════════
   LOGO
═══════════════════════════════════════ */

      .logo {
        margin-bottom: 20px;
      }

      .logo svg {
        width: min(90px, 11vw);
        height: auto;
      }

      /* ═══════════════════════════════════════
   ILUSTRACIÓN
═══════════════════════════════════════ */

      .illustration {
        width: 100%;
        max-width: 330px;
        margin-bottom: 22px;
      }

      .illustration img {
        width: 100%;
        height: auto;
        display: block;
        margin: 0 auto;
      }

      /* ═══════════════════════════════════════
   TITULAR
═══════════════════════════════════════ */

      .headline {
        font-size: clamp(1.8rem, 2.7vw, 2.9rem);
        font-weight: 900;

        line-height: 0.95;
        letter-spacing: -1.2px;

        max-width: 700px;

        margin-bottom: 14px;
      }

      /* ═══════════════════════════════════════
   SUBTEXTO
═══════════════════════════════════════ */

      .subtext {
        font-size: clamp(0.9rem, 1vw, 1rem);
        font-weight: 400;
        line-height: 1.5;
        color: #555;
        max-width: 500px;

        margin-bottom: 26px;

        /* MÁS ESPACIO ARRIBA */
        margin-top: 10px;
      }

      /* ═══════════════════════════════════════
   REDES SOCIALES
═══════════════════════════════════════ */

      .socials {
        display: flex;
        align-items: center;
        justify-content: center;

        gap: 20px;
        flex-wrap: wrap;
      }

      .socials a {
        color: #111;
        text-decoration: none;

        display: flex;
        align-items: center;
        justify-content: center;

        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
      }

      .socials a:hover {
        opacity: 0.5;
        transform: translateY(-2px);
      }

      .socials svg {
        width: 21px;
        height: 21px;
        fill: currentColor;
      }

      /* ═══════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════ */

      @media (max-width: 900px) {

        html,
        body {
          overflow-y: auto;
        }

        .home-section {
          width: 100%;
          margin-left: 0;

          min-height: 100vh;

          padding:
            30px 20px 120px;
        }

        .CONTENIDO {
          transform: translateY(-10px);
        }

        .illustration {
          max-width: 270px;
        }

        .headline {
          font-size: 2.2rem;
        }

      }

      @media (max-width: 600px) {

        .CONTENIDO {
          max-width: 100%;
          transform: none;
        }

        .illustration {
          max-width: 230px;
        }

        .headline {
          font-size: 1.9rem;
        }

        .subtext {
          font-size: 0.93rem;
        }

        .socials {
          gap: 15px;
        }

        .socials svg {
          width: 19px;
          height: 19px;
        }

      }
    </style>
</head>
