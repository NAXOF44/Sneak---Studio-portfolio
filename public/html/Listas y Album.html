<!DOCTYPE html>
<html lang="es">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="stylesheet" href="/css/Bar-player.css">
  <link rel="stylesheet" href="/css/proyectos.css">
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/footer.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" type="image/x-icon" href="/favicon_io/favsk (6).svg">
  <title>Álbum / Lista — Sneak Studio</title>

  <style>
    .sk-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 80px 20px;
      color: #555;
      font-size: 14px;
    }

    .sk-spinner {
      width: 36px;
      height: 36px;
      border: 2px solid #222;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .sk-error {
      text-align: center;
      padding: 80px 20px;
      color: #555;
    }

    .sk-error p {
      margin-bottom: 16px;
      font-size: 15px;
    }

    .sk-error a {
      color: #FF6200;
      text-decoration: none;
      font-size: 13px;
    }

    .album-hero {
      position: relative;
      padding: 60px 40px 48px;
      margin-bottom: 0;
      overflow: hidden;
    }

    .hero-bg-blur {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center 30%;
      filter: blur(24px) brightness(.35) saturate(1.3);
      transform: scale(1.08);
      transition: background-image .5s;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, #000 0%, rgba(0, 0, 0, .5) 60%, transparent 100%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      gap: 40px;
      flex-wrap: wrap;
    }

    .hero-cover {
      width: 220px;
      height: 220px;
      min-width: 220px;
      border-radius: 16px;
      object-fit: cover;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .7);
    }

    .hero-text {
      flex: 1;
      min-width: 0;
    }

    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, .12);
      color: #fff;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
    }

    .hero-text h1 {
      font-size: clamp(1.8rem, 5vw, 3.5rem);
      font-weight: 900;
      letter-spacing: -1.5px;
      background: linear-gradient(to right, #fff, #ccc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 6px 0 12px;
    }

    .hero-meta {
      color: #888;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .hero-btns {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-main-play {
      background: #fff;
      color: #000;
      border: none;
      padding: 13px 36px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform .15s, background .2s;
    }

    .btn-main-play:hover {
      background: #FF6200;
      color: #fff;
      transform: scale(1.02);
    }

    .btn-main-play.playing {
      background: rgba(255, 255, 255, .15);
      color: #fff;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, .25);
      color: #fff;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s, border-color .2s;
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, .08);
    }

    .btn-outline.liked {
      border-color: #ff4444;
      color: #ff4444;
    }

    .song-list-grid {
      padding: 20px 40px 40px;
    }

    .list-header {
      display: grid;
      grid-template-columns: 48px 2fr 1fr 80px 40px;
      padding: 10px 16px;
      color: #555;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid rgba(255, 255, 255, .06);
      margin-bottom: 6px;
    }

    .song-item {
      display: grid;
      grid-template-columns: 48px 2fr 1fr 80px 40px;
      padding: 12px 16px;
      border-radius: 10px;
      align-items: center;
      transition: background .15s;
      cursor: pointer;
    }

    .song-item:hover {
      background: rgba(255, 255, 255, .06);
    }

    .song-item.activo {
      background: rgba(255, 98, 0, .1);
    }

    .song-index-wrap {
      position: relative;
      width: 24px;
      text-align: center;
    }

    .song-num {
      font-size: 13px;
      color: #555;
    }

    .song-play-ico {
      display: none;
      font-size: 13px;
      color: #FF6200;
    }

    .song-item.activo .song-num {
      display: none;
    }

    .song-item.activo .song-play-ico {
      display: block;
    }

    .song-item:hover .song-num {
      display: none;
    }

    .song-item:hover .song-play-ico {
      display: block;
      color: #fff;
    }

    .song-cover {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: cover;
      background: #1a1a1a;
    }

    .song-main-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .song-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .song-name {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-item.activo .song-name {
      color: #FF6200;
    }

    .song-author {
      font-size: 12px;
      color: #666;
    }

    .song-album-name {
      font-size: 13px;
      color: #555;
    }

    .song-time {
      font-size: 13px;
      color: #555;
      text-align: right;
    }

    .song-like-btn {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
      transition: color .15s;
      opacity: 0;
    }

    .song-item:hover .song-like-btn {
      opacity: 1;
    }

    .song-like-btn.liked {
      color: #ff4444;
      opacity: 1;
    }

    .empty-list {
      text-align: center;
      padding: 60px 20px;
      color: #444;
    }

    .empty-list i {
      font-size: 40px;
      margin-bottom: 14px;
      display: block;
    }

    .empty-list p {
      font-size: 14px;
    }
  </style>
</head>

<body>
  <section id="app" class="home-section">

    <div id="sk-main-loading" class="sk-loading">
      <div class="sk-spinner"></div>
      <span>Cargando...</span>
    </div>

    <div id="album-content" style="display:none">
      <div class="album-hero" id="hero-section">
        <div class="hero-bg-blur" id="hero-bg"></div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
          <img id="hero-cover" class="hero-cover" src="" alt="Portada"
            onerror=\"this.src='/img/home-banner.png''\">
          <div class="hero-text">
            <span class="badge" id="hero-badge">Álbum</span>
            <h1 id="hero-titulo">—</h1>
            <p class="hero-meta" id="hero-meta">—</p>
            <div class="hero-btns">
              <button class="btn-main-play" id="btn-play-todo" onclick="reproducirTodo()">
                <i class="fas fa-play" id="play-ico"></i>
                <span id="play-txt">Reproducir</span>
              </button>
              <button class="btn-outline" id="btn-like-hero" onclick="toggleLikeHero()">
                <i class="far fa-heart" id="like-ico-hero"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="song-list-grid">
        <div class="list-header">
          <span>#</span>
          <span>Título</span>
          <span>Álbum</span>
          <span class="text-right"><i class="far fa-clock"></i></span>
          <span></span>
        </div>
        <div id="track-list"></div>
      </div>
    </div>

    <div id="sk-error" class="sk-error" style="display:none">
      <p id="error-msg">No se pudo cargar el contenido.</p>
      <a href="/inicio">← Volver al inicio</a>
    </div>

    <footer>
      <div class="contenni-footer">
        <div class="prin-footer">
          <p>Sneak Studio</p>
          <div class="icons">
            <a href="https://www.instagram.com/"><i class="fa-brands fa-instagram"></i></a>
            <a href=""><i class="fa-brands fa-square-x-twitter"></i></a>
            <a href=""><i class="fa-brands fa-facebook"></i></a>
          </div>
        </div>
      </div>
      <div class="derechos-footer">
        <a href="">
          <p>Política de privacidad</p>
        </a>
        <a href="">
          <p>Política de Cookies</p>
        </a>
        <a href="">
          <p>Aviso Legal</p>
        </a>
        <a href="">
          <p>Condiciones de Uso</p>
        </a>
      </div>
    </footer>

  </section>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="/js/emailjs-config.js"></script>
  <script src="/js/denuncia.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/player-global.js"></script>
  <script type="module" src="/js/auth-guard.js"></script>

  <script type="module">
    import {
      leerCancion, leerCancionesDeUsuario,
      toggleLike, isLiked, getUID, registrarReproduccion
    } from '/js/sneak-db.js';
    import { getUsuarioLocal } from '/js/firebase-auth.js';

    const $ = id => document.getElementById(id);

  

  function esc(s) {
    if (!s && s !== 0) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    function fmt(s) {
      if (!s) return '';
      const n = parseInt(s, 10);
      if (isNaN(n)) return s;
      return n >= 60
        ? `${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')}`
        : `0:${String(n).padStart(2, '0')}`;
    }

    function duracionTotal(tracks) {
      const seg = tracks.reduce((a, c) => a + (parseInt(c.duracion, 10) || 0), 0);
      if (!seg) return '';
      const m = Math.floor(seg / 60);
      return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`;
    }

    let _coleccion = null;
    let _tracks = [];
    let _playing = false;

    function renderHero(col, tracks) {
      const cover = col.portada || col.cover || col.imagen || '/img/home-banner.png';
      const titulo = col.titulo || col.nombre || '—';
      const tipo = col.tipo === 'lista' || col.tipo === 'playlist' ? 'Playlist'
        : col.tipo === 'ep' ? 'EP' : 'Álbum';
      const año = col.año || (col.creadoEn?.seconds
        ? new Date(col.creadoEn.seconds * 1000).getFullYear() : '');
      const meta = [col.artista, año,
      `${tracks.length} canción${tracks.length !== 1 ? 'es' : ''}`,
      duracionTotal(tracks)].filter(Boolean).join(' • ');

      $('hero-cover').src = cover;
      $('hero-bg').style.backgroundImage = `url('${cover}')`;
      $('hero-titulo').textContent = titulo;
      $('hero-meta').textContent = meta;
      $('hero-badge').textContent = tipo;
      document.title = `${titulo} — Sneak Studio`;
    }

    function renderTracks(activoIdx = -1) {
      const list = $('track-list');
      if (!_tracks.length) {
        list.innerHTML = `<div class="empty-list">
        <i class="fas fa-music"></i>
        <p>Esta colección aún no tiene canciones.</p></div>`;
        return;
      }
      list.innerHTML = _tracks.map((c, i) => {
        const cover = c.portada || c.cover || '/img/home-banner.png';
        const nombre = c.titulo || c.nombre || 'Sin título';
        const artista = esc(c.artista || '—');
        const album = c.album || c.tituloAlbum || '—';
        const dur = fmt(c.duracion);
        const activo = i === activoIdx ? 'activo' : '';
        return `<div class="song-item ${activo}" onclick="playTrack(${i})">
        <div class="song-index-wrap">
          <span class="song-num">${i + 1}</span>
          <i class="fas fa-play song-play-ico"></i>
        </div>
        <div class="song-main-info">
          <img class="song-cover" src="${cover}" alt=""
            onerror=\"this.src='/img/home-banner.png''\">
          <div class="song-text">
            <span class="song-name">${nombre}</span>
            <span class="song-author">${artista}</span>
          </div>
        </div>
        <div class="song-album-name">${album}</div>
        <div class="song-time">${dur}</div>
        <button class="song-like-btn"
          onclick="event.stopPropagation();toggleLikeTrack('${c.id}',this)">
          <i class="far fa-heart"></i>
        </button>
      </div>`;
      }).join('');
    }

    window.reproducirTodo = function () {
      if (!_tracks.length) return;
      _playing = !_playing;
      const btn = $('btn-play-todo');
      const ico = $('play-ico');
      const txt = $('play-txt');
      if (btn) btn.classList.toggle('playing', _playing);
      if (ico) ico.className = _playing ? 'fas fa-pause' : 'fas fa-play';
      if (txt) txt.textContent = _playing ? 'Pausar' : 'Reproducir';
      if (_playing && typeof window.cargarCola === 'function') {
        window.cargarCola(_tracks, 0); renderTracks(0);
      } else if (typeof window._togglePlayerPause === 'function') {
        window._togglePlayerPause();
      }
    };

    window.playTrack = function (idx) {
      const c = _tracks[idx]; if (!c) return;
      if (!c.audio) { window.location.href = `/cancion?id=${c.id}`; return; }
      if (typeof window.cargarCola === 'function') window.cargarCola(_tracks, idx);
      renderTracks(idx); _playing = true;
      const btn = $('btn-play-todo'); const ico = $('play-ico'); const txt = $('play-txt');
      if (btn) btn.classList.add('playing');
      if (ico) ico.className = 'fas fa-pause';
      if (txt) txt.textContent = 'Pausar';
      registrarReproduccion(c.id).catch(() => { });
    };

    window._onSongPauseChange = function (isPaused) {
      _playing = !isPaused;
      const btn = $('btn-play-todo'); const ico = $('play-ico'); const txt = $('play-txt');
      if (btn) btn.classList.toggle('playing', !isPaused);
      if (ico) ico.className = isPaused ? 'fas fa-play' : 'fas fa-pause';
      if (txt) txt.textContent = isPaused ? 'Reproducir' : 'Pausar';
    };

    window.toggleLikeHero = async function () {
      if (!_coleccion) return;
      if (!getUID()) { window.location.href = '/login'; return; }
      try {
        const nuevo = await toggleLike(_coleccion.id);
        const ico = $('like-ico-hero'); const btn = $('btn-like-hero');
        if (ico) ico.className = nuevo ? 'fas fa-heart' : 'far fa-heart';
        if (btn) btn.classList.toggle('liked', nuevo);
      } catch (e) { console.error('[Listas] toggleLikeHero:', e); }
    };

    window.toggleLikeTrack = async function (cancionId, btn) {
      if (!getUID()) { window.location.href = '/login'; return; }
      try {
        const nuevo = await toggleLike(cancionId);
        const ico = btn.querySelector('i');
        if (ico) ico.className = nuevo ? 'fas fa-heart' : 'far fa-heart';
        btn.classList.toggle('liked', nuevo);
      } catch (e) { console.error('[Listas] toggleLikeTrack:', e); }
    };

    async function cargarEstadoLikes() {
      if (!getUID()) return;
      if (_coleccion?.id) {
        const liked = await isLiked(_coleccion.id).catch(() => false);
        if (liked) {
          const ico = $('like-ico-hero'); const btn = $('btn-like-hero');
          if (ico) ico.className = 'fas fa-heart';
          if (btn) btn.classList.add('liked');
        }
      }
      const items = document.querySelectorAll('.song-item');
      _tracks.forEach((c, i) => {
        isLiked(c.id).then(liked => {
          const btn = items[i]?.querySelector('.song-like-btn');
          if (btn && liked) {
            btn.querySelector('i').className = 'fas fa-heart';
            btn.classList.add('liked');
          }
        }).catch(() => { });
      });
    }

    function mostrarError(msg) {
      $('sk-main-loading').style.display = 'none';
      $('album-content').style.display = 'none';
      $('sk-error').style.display = 'block';
      if ($('error-msg')) $('error-msg').textContent = msg;
    }

    async function init() {
      if (!id) { mostrarError('No se especificó ningún álbum o lista.'); return; }
      try {
        const coleccion = await leerCancion(id);
        if (!coleccion) { mostrarError('Álbum o lista no encontrado.'); return; }
        _coleccion = coleccion;

        let tracks = [];
        if (Array.isArray(coleccion.tracks) && coleccion.tracks.length) {
          // tracks guardados como array de IDs dentro del documento
          const res = await Promise.all(coleccion.tracks.map(tid => leerCancion(tid).catch(() => null)));
          tracks = res.filter(Boolean);
        } else {
          // Buscar canciones del mismo artista que pertenezcan a este álbum
          const todas = await leerCancionesDeUsuario(coleccion.uid).catch(() => []);
          tracks = todas.filter(c =>
            c.id !== id &&
            (c.album === coleccion.titulo || c.tituloAlbum === coleccion.titulo)
          );
          // Si no hay match por álbum y es EP/lista, mostrar todas las del artista
          if (!tracks.length && ['ep', 'lista', 'playlist'].includes(coleccion.tipo)) {
            tracks = todas.filter(c => c.id !== id && (c.tipo === 'sencillo' || !c.tipo));
          }
        }

        _tracks = tracks;
        renderHero(coleccion, tracks);
        renderTracks();

        $('sk-main-loading').style.display = 'none';
        $('album-content').style.display = 'block';

        cargarEstadoLikes();
      } catch (e) {
        console.error('[Listas] init:', e);
        mostrarError('Error al conectar con la base de datos.');
      }
    }

    init();
  </script>

  <script src="/js/scroll-buttons.js"></script>
</body>

</html>
