<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sneak – En mantenimiento</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            user-select: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            color: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2vh 20px;
            gap: 0;
        }

        /* ── LOGO ── */
        .logo {
            flex-shrink: 0;
            margin-bottom: 2.5vh;
        }

        .logo svg {
            width: min(110px, 14vw);
            height: auto;
        }

        /* ── ILUSTRACIÓN ── */
        .illustration {
            flex-shrink: 1;
            width: 100%;
            max-width: min(420px, 55vw);
            margin-bottom: 2.5vh;
        }

        .illustration img {
            width: 90%;
            height: auto;
            display: block;
        }

        /* ── TITULAR ── */
        .headline {
            font-size: clamp(1.3rem, 3.1vw, 3rem);
            font-weight: 900;
            line-height: 0.9;
            text-align: center;
            letter-spacing: -0.5px;
            max-width: 600px;
            margin-bottom: 1.5vh;
        }

        /* ── SUBTEXTO ── */
        .subtext {
            font-size: clamp(0.78rem, 1.3vw, 1rem);
            font-weight: 400;
            text-align: center;
            line-height: 1.6;
            max-width: 360px;
            margin-bottom: 2.5vh;
        }

        /* ── ICONOS SOCIALES ── */
        .socials {
            display: flex;
            align-items: center;
            gap: clamp(12px, 2vw, 22px);
            flex-wrap: wrap;
            justify-content: center;
        }

        .socials a {
            color: #111;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        .socials a:hover {
            opacity: 0.45;
        }

        .socials svg {
            width: clamp(18px, 2.2vw, 24px);
            height: clamp(18px, 2.2vw, 24px);
            fill: #111;
        }
    </style>
</head>
