<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicia sesión en SNEAK para acceder a tu cuenta.">
  <title>SNEAK — Iniciar Sesión</title>
  <link rel="icon" type="image/x-icon" href="/favicon_io/favsk.svg">
  <link rel="stylesheet" href="/css/login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5/css/all.min.css">
  <style>
    .form-group .error-msg {
      font-size: 12px; color: #ff4444;
      margin-top: 5px; display: none;
    }
    .form-group input.input-error { border-color: #ff4444 !important; }
    .submit-btn:disabled { opacity: .6; cursor: not-allowed; }
    .submit-btn .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(0,0,0,.3); border-top-color: #000;
      border-radius: 50%; animation: spin .7s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .auth-toast {
      position: fixed; bottom: 32px; left: 50%;
      transform: translateX(-50%);
      background: #fff; color: #000;
      padding: 11px 24px; border-radius: 50px;
      font-size: 13px; font-weight: 700;
      box-shadow: 0 4px 24px rgba(0,0,0,.3);
      z-index: 9999; white-space: nowrap;
      opacity: 0; transition: opacity .3s; pointer-events: none;
    }
    .auth-toast.show { opacity: 1; }
    .social-btn { transition: opacity .2s; }
    .social-btn:hover { opacity: .8; }
    .forgot-link {
      font-size: 13px; color: rgba(255,255,255,.45);
      text-decoration: none; transition: color .2s;
    }
    .forgot-link:hover { color: #fff; }
  </style>
</head>
<body>
  <main class="auth-wrapper">

    <section class="auth-image" aria-hidden="true">
      <img src="/img/gif-ligin.gif" class="main-img" alt="Sneak Studio">
      <div class="overlay-logo">
        <img src="/img/logo (1).png" alt="Logo SNEAK">
      </div>
    </section>

    <section class="auth-form">
      <header class="auth-header">
        <h1>Bienvenido de nuevo</h1>
        <p>Ingresa tus credenciales para continuar.</p>
      </header>

      <div class="social-grid">
        <button type="button" class="social-btn" id="btn-apple" aria-label="Apple">
          <img src="/img/Apple_Logo_0 1.png" alt="">
          <span>Continuar con Apple</span>
        </button>
        <button type="button" class="social-btn" id="btn-google" aria-label="Google">
          <img src="/img/image 155.png" alt="">
          <span>Continuar con Google</span>
        </button>
      </div>

      <div class="divider"><span>o</span></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" placeholder="ejemplo@correo.com"
            autocomplete="email" required>
          <span class="error-msg" id="err-email"></span>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Tu contraseña"
              autocomplete="current-password" required>
            <button type="button" class="toggle-password" id="toggle-pass" aria-label="Mostrar">
              <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">
                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19C5 19 1 12 1 12a21.86 21.86 0 0 1 5.06-6.94"/>
                <path d="M1 1l22 22"/>
              </svg>
            </button>
          </div>
          <span class="error-msg" id="err-pass"></span>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="remember"> Recordarme
          </label>
          <a href="#" class="forgot-link" id="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="submit-btn" id="btn-submit">Iniciar Sesión</button>
      </form>

      <footer class="auth-footer">
        ¿Nuevo en SNEAK? <a href="/signup">Regístrate gratis</a>
      </footer>
    </section>
  </main>

  <div class="auth-toast" id="toast"></div>

  <script type="module">
    

    if (new URLSearchParams(location.search).get('baneado') === '1') {
      const msg = document.createElement('div');
      msg.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a0505;border:1px solid rgba(229,62,62,.35);color:#fc8181;padding:14px 24px;border-radius:12px;font-size:13px;font-family:Outfit,sans-serif;z-index:9999;text-align:center;max-width:360px;line-height:1.5';
      msg.innerHTML = '<strong>Cuenta suspendida</strong><br>Tu cuenta ha sido suspendida por infringir las normas de Sneak Studio. Contacta a <a href="mailto:Email" style="color:#ff9999">Email</a> si crees que es un error.';
      document.body.appendChild(msg);
    }
    

    import {
      getAuth_,
      signInWithEmailAndPassword,
      signInWithPopup,
      sendPasswordResetEmail,
      guardarSesionLocal,
      leerPerfilFirestore,
      getUsuarioLocal,
    } from '/js/firebase-auth.js';
    import { GoogleAuthProvider } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    const auth           = await getAuth_();
    const googleProvider = new GoogleAuthProvider();

    

    function toast(msg, dur = 3500) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), dur);
    }

    function setError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.style.display = msg ? 'block' : 'none';
    }

    function setLoading(on) {
      const btn = document.getElementById('btn-submit');
      btn.disabled = on;
      btn.innerHTML = on
        ? '<span class="spinner"></span> Entrando...'
        : 'Iniciar Sesión';
    }

    function limpiarErrores() {
      ['err-email', 'err-pass'].forEach(id => setError(id, ''));
      ['email', 'password'].forEach(id =>
        document.getElementById(id).classList.remove('input-error'));
    }

    function mensajeError(code) {
      const errores = {
        'auth/user-not-found':         'No existe cuenta con ese correo',
        'auth/wrong-password':         'Contraseña incorrecta',
        'auth/invalid-email':          'Correo no válido',
        'auth/invalid-credential':     'Correo o contraseña incorrectos',
        'auth/too-many-requests':      'Demasiados intentos. Espera un momento',
        'auth/network-request-failed': 'Sin conexión. Revisa tu internet',
        'auth/user-disabled':          'Esta cuenta ha sido desactivada',
      };
      return errores[code] || 'Error al iniciar sesión. Inténtalo de nuevo';
    }

    


    async function redirigirTrasLogin(firebaseUser) {
      let perfil = {};
      try {
        perfil = await leerPerfilFirestore(firebaseUser.uid) || {};
      } catch (_) {}

      const user = guardarSesionLocal(firebaseUser, perfil);

      if (user.onboarding === true) {
        window.location.href = '/inicio';
      } else {
        window.location.href = '/onboarding';
      }
    }

    

    const sesionActual = getUsuarioLocal();
    if (sesionActual?.uid) {
      window.location.href = sesionActual.onboarding ? '/inicio' : '/onboarding';
    }

    

    document.getElementById('toggle-pass').addEventListener('click', () => {
      const inp = document.getElementById('password');
      inp.type = inp.type === 'password' ? 'text' : 'password';
      document.getElementById('toggle-pass').classList.toggle('active');
    });

    

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      limpiarErrores();

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      let valido = true;
      if (!email) {
        setError('err-email', 'Escribe tu correo');
        document.getElementById('email').classList.add('input-error');
        valido = false;
      }
      if (!password) {
        setError('err-pass', 'Escribe tu contraseña');
        document.getElementById('password').classList.add('input-error');
        valido = false;
      }
      if (!valido) return;

      setLoading(true);
      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        await redirigirTrasLogin(cred.user);
      } catch (err) {
        setLoading(false);
        const msg = mensajeError(err.code);
        setError('err-pass', msg);
        document.getElementById('password').classList.add('input-error');
      }
    });

    

    document.getElementById('btn-google').addEventListener('click', async () => {
      try {
        const cred = await signInWithPopup(auth, googleProvider);
        await redirigirTrasLogin(cred.user);
      } catch (err) {
        if (err.code !== 'auth/popup-closed-by-user') {
          toast('Error con Google. Inténtalo de nuevo');
        }
      }
    });

    

    document.getElementById('forgot-link').addEventListener('click', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) {
        setError('err-email', 'Escribe tu correo primero');
        document.getElementById('email').classList.add('input-error');
        document.getElementById('email').focus();
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        toast(`✓ Correo de recuperación enviado a ${email}`, 5000);
      } catch (err) {
        const msg = err.code === 'auth/user-not-found'
          ? 'No existe cuenta con ese correo'
          : 'Error al enviar el correo. Inténtalo de nuevo';
        setError('err-email', msg);
        document.getElementById('email').classList.add('input-error');
      }
    });

    

    document.getElementById('btn-apple').addEventListener('click', () => {
      toast('Login con Apple próximamente');
    });
  </script>
</body>
</html>
